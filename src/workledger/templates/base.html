<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}WorkLedger{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="nav">
    <a href="/" class="nav-brand">WorkLedger</a>
    <div class="nav-links">
        <a href="/" class="{{ 'active' if request.url.path == '/' }}">Today</a>
        <a href="/search" class="{{ 'active' if request.url.path == '/search' }}">Search</a>
        <a href="/todos" class="{{ 'active' if request.url.path == '/todos' }}">To-dos</a>
        <a href="/retrospective" class="{{ 'active' if request.url.path == '/retrospective' }}">Retrospective</a>
        <a href="/settings" class="{{ 'active' if request.url.path == '/settings' }}">Settings</a>
    </div>
</nav>
<main class="container">
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
